
flysystem:
    storages:
        storage.memory.proxy:
            local:
                directory: '%dists_dir%'

        storage.local.repo:
            local:
                directory: '%repo_dir%'

        repo.storage:
            lazy:
                source: 'storage.local.repo'

        proxy.storage:
            lazy:
                source: 'storage.local.proxy'
